# Five-client same-task cross-domain extractive-QA FedIT run.
alg: fedit
suffix: same_task_cross_domain_qa_fedit
device: 0
dataset: same_task_cross_domain_qa
model: Qwen3-1.7B
task_type: CAUSAL_LM
seed: 42
deterministic: true

cn: 5
sr: 1.0
rnd: 10
test_gap: 1
cross_domain_qa: true

# One identical local protocol for each of the five clients.
bs: 1
grad_accum: 8
epoch: 1
step: 125
lr: 0.0001
eval_batch_size: 8

mode: prototype
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.05
