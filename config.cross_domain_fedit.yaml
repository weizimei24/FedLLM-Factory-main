# Controlled four-domain MRQA QA pilot: FedIT/FedAvg only.
alg: fedit
suffix: cross_domain_mrqa_fedit
device: 0
dataset: cross_domain_mrqa
model: Qwen3-1.7B
task_type: CAUSAL_LM
seed: 42
deterministic: true

# One client per domain; every client participates every round.
cn: 4
sr: 1.0
rnd: 10
test_gap: 1
cross_domain_qa: true

# Identical local optimisation protocol for both methods.
bs: 1
grad_accum: 8
epoch: 1
step: 125
lr: 0.0001
eval_batch_size: 8

mode: prototype
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.05
